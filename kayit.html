<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura RP Kayıt</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins',sans-serif; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; }
.container { background:rgba(0,0,0,0.8); padding:50px; border-radius:20px; border:2px solid #0ff; width:350px; text-align:center; }
.container h2 { font-family:'Orbitron',sans-serif; color:#0ff; margin-bottom:20px; }
.container input { width:100%; padding:10px; margin:10px 0; border-radius:10px; border:2px solid #0ff; background:#000; color:#fff; }
.container button { padding:10px 20px; border-radius:50px; border:2px solid #0ff; background:transparent; color:#0ff; cursor:pointer; margin-top:10px; width:100%; transition:.3s; }
.container button:hover { background:#0ff; color:#000; box-shadow:0 0 15px #0ff; }
.oauth-btn { display:flex; justify-content:space-around; margin:20px 0; }
.oauth-btn button { width:48%; }
.message { margin-top:15px; color:#0ff; }
</style>
</head>
<body>

<div class="container">
  <h2>Kayıt Ol</h2>
  <input type="text" id="username" placeholder="Kullanıcı Adı">
  <input type="email" id="email" placeholder="E-posta">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="register()">Kayıt Ol</button>

  <div class="oauth-btn">
    <button onclick="oauth('google')">Google ile Giriş</button>
    <button onclick="oauth('discord')">Discord ile Giriş</button>
  </div>

  <p>Zaten üye misin? <a href="giris.html" style="color:#0ff">Giriş Yap</a></p>
  <p class="message" id="msg"></p>
</div>

<script>
function register(){
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if(username && email && password){
    localStorage.setItem('auraRP_user', username);
    document.getElementById('msg').textContent = "Kayıt başarılı! Artık giriş yapabilirsiniz.";
  }else{
    document.getElementById('msg').textContent = "Lütfen tüm alanları doldurun!";
  }
}

function oauth(provider){
  alert(provider + " ile giriş (demo). Gerçek OAuth entegrasyonu sunucu tarafında gerekir.");
}
</script>

</body>
</html>
