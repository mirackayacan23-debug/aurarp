</head>
<body>
  <nav class="nav">
    <div class="brand">AuraRP</div>

  <section class="page">
    <h1>📝 Kendi Hikayeni Yaz</h1>
    <p>Karakterinin geçmişini, kişiliğini ve hikayesini bizimle paylaş.</p>

    <div class="form-glass animated-form">
      <form id="hikayeForm" class="form">
        <div class="field">
          <input type="text" id="karakter" placeholder=" " required />
          <label>Karakter Adı</label>
        </div>

        <div class="field">
          <textarea id="hikaye" placeholder=" " rows="8" required></textarea>
          <label>Hikayeni buraya yaz...</label>
        </div>

        <button type="submit" class="btn-primary">Hikayeyi Gönder</button>
      </form>
      <p id="hikayeSonuc" style="margin-top:15px;"></p>
    </div>
  </section>

  <footer>© 2025 AuraRP. Tüm hakları saklıdır.</footer>

  <script>
    const hikayeForm = document.getElementById("hikayeForm");
    const hikayeSonuc = document.getElementById("hikayeSonuc");

    hikayeForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const karakter = document.getElementById("karakter").value;
      const hikaye = document.getElementById("hikaye").value;

      const webhookURL = "WEBHOOK_URL"; // 🔹 Buraya hikaye kanalının webhook'unu gir

      const payload = {
        content: `📖 **Yeni Hikaye Paylaşıldı!**\n**Karakter:** ${karakter}\n\n${hikaye}`
      };

      try {
        const response = await fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          hikayeSonuc.textContent = "✅ Hikayen başarıyla gönderildi!";
          hikayeSonuc.style.color = "#4ade80";
          hikayeForm.reset();
        } else {
          hikayeSonuc.textContent = "⚠️ Bir hata oluştu. Tekrar dene.";
          hikayeSonuc.style.color = "#f87171";
        }
      } catch (error) {
        hikayeSonuc.textContent = "🚫 Bağlantı kurulamadı.";
        hikayeSonuc.style.color = "#f87171";
      }
    });
  </script>
</body>
</html>
