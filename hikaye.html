<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />

  <title>Hikayeni Yaz — AuraRP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="brand">AuraRP</div>
    <div class="nav-links">
      <a href="index.html">Ana Sayfa</a>
      <a href="characters.html">Karakterler</a>

      <a href="basvuru.html">Ekip Başvurusu</a>
      <a href="etkinlik.html">Etkinlikler</a>
    </div>
  </nav>

  <main class="page">
    <h1>Hikayeni Yaz</h1>
    <p>Karakterinin geçmişini paylaş. (Gönderimler Discord webhook ile düşecekse webhook URL'sini ekle.)</p>

    <div class="form-glass">
      <form id="storyForm" class="animated-form">
        <div class="field">
          <input id="karakter" type="text" placeholder=" " required>
          <label for="karakter">Karakter Adı</label>
        </div>
        <div class="field">
          <textarea id="hikaye" placeholder=" " rows="8" required></textarea>
          <label for="hikaye">Hikayen</label>
        </div>
        <button type="submit" class="btn-primary">Hikayeyi Gönder</button>
      </form>
      <p id="storyResult" style="margin-top:12px;color:var(--muted)"></p>
    </div>
  </main>

  <footer>© 2025 AuraRP</footer>

<script>
  // Webhook gönderimi istersen webhookURL değişkenine yapıştır.
  const storyForm = document.getElementById('storyForm');
  const storyResult = document.getElementById('storyResult');
  const storyWebhookURL = ''; // <-- buraya webhook koy (ör: https://discord.com/api/webhooks/...)

  storyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const karakter = document.getElementById('karakter').value.trim();
    const hikaye = document.getElementById('hikaye').value.trim();
    if(!storyWebhookURL){
      storyResult.textContent = '⚠️ Gönderim etkin değil. Webhook URL ayarlanmamış.';
      return;
    }
    const payload = { content: `📖 Yeni Hikaye\n**Karakter:** ${karakter}\n\n${hikaye}` };
    try {
      const res = await fetch(storyWebhookURL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      if(res.ok){ storyResult.textContent = '✅ Hikayen gönderildi!'; storyForm.reset(); }
      else { storyResult.textContent = '⚠️ Gönderilirken hata oldu.'; }
    } catch (err) { storyResult.textContent = '🚫 Bağlantı hatası.'; }
  });
</script>
</body>
</html>
