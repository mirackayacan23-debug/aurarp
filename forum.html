<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura RP Forum</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Poppins',sans-serif; background: radial-gradient(circle at top, #000010,#020202); color:#fff; }
header { background: rgba(0,0,0,0.85); border-bottom:2px solid #0ff; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
header h1 { font-family:'Orbitron',sans-serif; font-size:28px; color:#0ff; }
nav a { color:#fff; text-decoration:none; margin:0 15px; transition:.3s;}
nav a:hover { color:#0ff; text-shadow:0 0 10px #0ff;}
.container { max-width:1200px; margin:30px auto; padding:0 20px; }
.forum-card { background: rgba(0,0,0,0.5); border:2px solid #00ffff55; border-radius:15px; padding:15px; margin-bottom:15px; }
.forum-card h3 { color:#0ff; margin:0 0 5px 0; }
.forum-card p { color:#ccc; margin:0; font-size:14px; }
.forum-actions { text-align:right; margin-bottom:20px; }
.forum-actions button { background:transparent; border:2px solid #0ff; color:#0ff; padding:5px 15px; border-radius:50px; cursor:pointer; transition:.3s; }
.forum-actions button:hover { background:#0ff; color:#000; box-shadow:0 0 15px #0ff; }
</style>
</head>
<body>

<header>
<h1>Aura RP Forum</h1>
<nav>
  <a href="index.html">Ana Sayfa</a>
  <a href="market.html">Market</a>
  <a href="forum.html">Forum</a>
  <a href="sepet.html">🛒 Sepet</a>
</nav>
</header>

<div class="container">
  <div class="forum-actions">
    <button id="newTopic">Yeni Konu Aç</button>
  </div>
  <div id="forumContainer"></div>
</div>

<script>
// Basit forum sistemi (localStorage)
let forumTopics = JSON.parse(localStorage.getItem("aura_forum")) || [];

function renderForum(){
  const container = document.getElementById("forumContainer");
  container.innerHTML = "";
  forumTopics.forEach((topic, i)=>{
    const card = document.createElement("div");
    card.className="forum-card";
    card.innerHTML=`
      <h3>${topic.title}</h3>
      <p>${topic.content}</p>
      <p style="color:#0ff; font-size:12px;">Yazan: ${topic.author}</p>
    `;
    container.appendChild(card);
  });
}

document.getElementById("newTopic").addEventListener("click",()=>{
  const title = prompt("Konu Başlığı:");
  if(!title) return;
  const content = prompt("Konu İçeriği:");
  if(!content) return;
  const author = localStorage.getItem("auraRP_user") || "Anonim";
  forumTopics.push({title,content,author});
  localStorage.setItem("aura_forum",JSON.stringify(forumTopics));
  renderForum();
});

renderForum();
</script>

</body>
</html>
