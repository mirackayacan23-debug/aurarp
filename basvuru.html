  <section class="page">
    <h1>🧩 Ekip Başvurusu</h1>
    <p>Ekibe katılmak için aşağıdaki formu dikkatlice doldur.</p>

    <div class="form-glass animated-form">
      <form class="form">
        <div class="field">
          <input type="text" placeholder=" " required />
          <label>Ad Soyad</label>
        </div>

        <div class="field">
          <input type="text" placeholder=" " required />
          <label>Discord Kullanıcı Adı</label>
        </div>

        <div class="field">
          <select required>
            <option value="" disabled selected>Başvurmak İstediğin Rol</option>
            <option>Admin Ekibi</option>
            <option>Destek Ekibi</option>
            <option>EMS</option>
            <option>LSPD</option>
            <option>Mekanik</option>
          </select>
        </div>

        <div class="field">
          <textarea placeholder=" " rows="6" required></textarea>
          <label>Neden bu ekibe katılmak istiyorsun?</label>
        </div>

        <button type="submit" class="btn-primary">Başvuru Gönder</button>
      </form>
    </div>
  </section>
