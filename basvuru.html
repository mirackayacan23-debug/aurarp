  <section class="page">
    <h1>🧩 Ekip Başvurusu</h1>
    <p>Yönetim veya rol ekibimize katılmak istiyorsan aşağıdaki formu dikkatlice doldur.</p>

    <div class="form-glass">
      <form class="form">
        <input type="text" placeholder="Ad Soyad" required />
        <input type="text" placeholder="Discord Kullanıcı Adı (ör. kullanici#0001)" required />
        <select required>
          <option value="" disabled selected>Başvurmak İstediğin Rol</option>
          <option>Admin Ekibi</option>
          <option>Destek Ekibi</option>
          <option>EMS</option>
          <option>LSPD</option>
          <option>Mekanik</option>
        </select>
        <textarea placeholder="Neden bu ekibe katılmak istiyorsun?" rows="6" required></textarea>
        <button type="submit" class="btn-primary">Başvuru Gönder</button>
      </form>
    </div>
  </section>
