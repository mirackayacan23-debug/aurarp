<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="brand">AuraRP</div>
    <div class="nav-links">
      <a href="index.html">Ana Sayfa</a>

      <a href="etkinlik.html">Etkinlikler</a>
    </div>
  </nav>

  <main class="page">
    <h1>Ekip Başvurusu</h1>
    <p>Başvurular Discord kanalına düşecek şekilde ayarlanabilir (webhook).</p>

    <div class="form-glass">
      <form id="applyForm" class="animated-form">
        <div class="field">
          <input id="isimtag" type="text" placeholder=" " required>
          <label for="isimtag">İsim ve Discord Etiketin</label>
        </div>
        <div class="field">
          <select id="basvuruPoz" required>
            <option value="" disabled selected>Pozisyon seç</option>
            <option>Yetkili</option>
            <option>Destek</option>
            <option>Developer</option>
            <option>Grafiker</option>
          </select>
        </div>
        <div class="field">
          <textarea id="nedenTxt" placeholder=" " rows="6" required></textarea>
          <label for="nedenTxt">Kendini tanıt ve neden seçilmeli?</label>
        </div>
        <button type="submit" class="btn-primary">Başvuruyu Gönder</button>
      </form>
      <p id="applyResult" style="margin-top:12px;color:var(--muted)"></p>
    </div>
  </main>

  <footer>© 2025 AuraRP</footer>

<script>
  // Webhook gönderimi için buraya webhook URL'sini koy:
  const applyWebhookURL = ''; // örn: "https://discord.com/api/webhooks/..."

  const applyForm = document.getElementById('applyForm');
  const applyResult = document.getElementById('applyResult');

  applyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const isim = document.getElementById('isimtag').value.trim();
    const poz = document.getElementById('basvuruPoz').value;
    const neden = document.getElementById('nedenTxt').value.trim();

    if(!applyWebhookURL){
      applyResult.textContent = '⚠️ Gönderim aktif değil. Webhook URL ayarlanmamış.';
      return;
    }

    const payload = {
      content: `📨 Yeni Başvuru\n**İsim:** ${isim}\n**Pozisyon:** ${poz}\n**Neden:** ${neden}`
    };

    try {
      const r = await fetch(applyWebhookURL, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      if(r.ok){ applyResult.textContent = '✅ Başvuru gönderildi!'; applyForm.reset(); }
      else { applyResult.textContent = '⚠️ Gönderim hatası.'; }
    } catch (err) { applyResult.textContent = '🚫 Ağa bağlanılamadı.'; }
  });
</script>
</body>
</html>
