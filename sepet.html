<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura RP Sepet</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Poppins',sans-serif; background: radial-gradient(circle at top, #000010,#020202); color:#fff; }
header, footer { background: rgba(0,0,0,0.85); padding:15px 30px; text-align:center; }
header h1, footer p { color:#0ff; font-family:'Orbitron',sans-serif; }
nav a { color:#fff; text-decoration:none; margin:0 15px; transition:.3s;}
nav a:hover { color:#0ff; text-shadow:0 0 10px #0ff;}
.container { max-width:1200px; margin:30px auto; padding:0 20px; }
.card { background: rgba(0,0,0,0.5); border:2px solid #00ffff55; border-radius:15px; padding:20px; display:flex; align-items:center; gap:20px; margin-bottom:15px;}
.card img { width:80px; border-radius:10px; }
.card h3 { color:#0ff; margin:0; flex:1; }
.card p { color:#ccc; margin:0; }
.card button { background:transparent; border:2px solid #0ff; color:#0ff; padding:5px 15px; border-radius:50px; cursor:pointer; transition:.3s;}
.card button:hover { background:#0ff; color:#000; box-shadow:0 0 15px #0ff; }
.total { text-align:right; font-size:20px; margin-top:20px; color:#0ff; }
</style>
</head>
<body>

<header>
  <h1>Aura RP Sepetiniz</h1>
  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="market.html">Market</a>
    <a href="forum.html">Forum</a>
  </nav>
</header>

<div class="container" id="cartContainer"></div>
<div class="container total" id="totalPrice"></div>
<div class="container" style="text-align:right; margin-top:20px;">
  <a href="https://discord.gg/quWAxqxK4T" style="color:#0ff; font-weight:600; text-decoration:none; font-size:18px;">Discord’dan Satın Al</a>
</div>

<footer>
  <p>© 2025 Aura Roleplay</p>
</footer>

<script>
// Sepet verisi
let cart = JSON.parse(localStorage.getItem("aura_cart")) || [];
const cartContainer = document.getElementById("cartContainer");
const totalPriceEl = document.getElementById("totalPrice");

// Sepeti göster
function renderCart() {
  cartContainer.innerHTML = "";
  let total = 0;
  cart.forEach((item, index) => {
    total += item.price;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h3>${item.name}</h3>
      <p>₺${item.price}</p>
      <button id="remove${index}">Kaldır</button>
    `;
    cartContainer.appendChild(card);

    document.getElementById(`remove${index}`).addEventListener("click", () => {
      cart.splice(index, 1);
      localStorage.setItem("aura_cart", JSON.stringify(cart));
      renderCart();
    });
  });
  totalPriceEl.textContent = "Toplam: ₺" + total;
}

// İlk render
renderCart();
</script>

</body>
</html>
