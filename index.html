<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA RP</title>
    <style>
        /* Genel ayarlar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #1c1c1c;
        }

        nav .logo {
            font-weight: bold;
            font-size: 24px;
            color: #ff9800;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li {
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s;
        }

        nav ul li:hover {
            color: #ff9800;
        }

        /* Hero */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: url('https://i.ibb.co/0C0vP7y/city-bg.jpg') center/cover no-repeat;
            height: 80vh;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #ff9800;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .hero .btn {
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hero .btn-start {
            background-color: #ff9800;
            color: #121212;
            border: none;
        }

        .hero .btn-start:hover {
            background-color: #e68a00;
        }

        .hero .btn-login {
            background-color: transparent;
            color: #ff9800;
            border: 2px solid #ff9800;
        }

        .hero .btn-login:hover {
            background-color: #ff9800;
            color: #121212;
        }

        /* İstatistikler */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 50px 20px;
            background-color: #1c1c1c;
        }

        .stat {
            background-color: #222;
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
        }

        .stat h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ff9800;
        }

        .stat p {
            font-size: 16px;
            color: #ccc;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 16px;
            }

            .stats {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AURARP</div>
        <ul>
            <li>Karakterler</li>
            <li>Kurallar</li>
            <li>İstatistikler</li>
        </ul>
    </nav>

    <section class="hero">
        <h1><span>AURA</span> ROLEPLAY</h1>
        <p>En gerçekçi GTA San Andreas Roleplay deneyimi sizi bekliyor. Kendi hikayenizi yazın, karakterinizi yaşayın.</p>
        <div>
            <button class="btn btn-start">Hemen Başla</button>
            <button class="btn btn-login">Giriş Yap</button>
        </div>
    </section>

    <section class="stats">
        <div class="stat">
            <h2>42</h2>
            <p>Aktif Oyuncu</p>
        </div>
        <div class="stat">
            <h2>0</h2>
            <p>Toplam Oyuncu</p>
        </div>
        <div class="stat">
            <h2>0</h2>
            <p>Onaylı Karakter</p>
        </div>
    </section>

</body>
</html>
