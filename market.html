<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura RP Market</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Poppins',sans-serif; background:#000; color:#fff; }

/* Header */
header { position:fixed; top:0; width:100%; z-index:1000; display:flex; justify-content:space-between; align-items:center; padding:15px 50px; background:rgba(0,0,0,0.85); border-bottom:2px solid #0ff; }
header h1 { font-family:'Orbitron',sans-serif; font-size:32px; color:#0ff; text-shadow:0 0 15px #0ff; }
nav a { color:#fff; text-decoration:none; margin:0 15px; font-weight:600; transition:.3s; }
nav a:hover { color:#0ff; text-shadow:0 0 10px #0ff; }
.user-bar { text-align:right; padding:10px 50px; margin-top:70px; font-weight:500; color:#0ff; }

/* Market Grid */
.market-container { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; max-width:1200px; margin:150px auto 50px; padding:0 20px; }
.product { background:rgba(0,0,0,0.7); border:2px solid #0ff; border-radius:15px; padding:20px; text-align:center; transition:.3s; position:relative; }
.product:hover { transform:scale(1.05); box-shadow:0 0 25px #0ff; }
.product img { width:100%; border-radius:10px; margin-bottom:15px; }
.product h4 { color:#0ff; margin-bottom:5px; font-size:18px; }
.product p { color:#ccc; font-size:14px; margin-bottom:10px; }
.product .price { color:#0ff; font-weight:600; margin-bottom:10px; }
.product button { background:transparent; border:2px solid #0ff; color:#0ff; padding:10px 20px; border-radius:50px; font-weight:600; cursor:pointer; transition:.3s; }
.product button:hover { background:#0ff; color:#000; box-shadow:0 0 15px #0ff; }

/* Sepet */
#cart { position:fixed; right:20px; top:100px; background:rgba(0,0,0,0.85); padding:20px; border:2px solid #0ff; border-radius:15px; width:250px; max-height:400px; overflow-y:auto; }
#cart h3 { color:#0ff; text-align:center; margin-bottom:15px; }
#cart ul { list-style:none; color:#ccc; }
#cart ul li { padding:5px 0; border-bottom:1px solid #0ff; display:flex; justify-content:space-between; }
#cart button { margin-top:10px; width:100%; }

/* Footer */
footer { text-align:center; padding:30px; background: rgba(0,0,0,0.85); border-top:2px solid #0ff; color:#ccc; font-size:14px; }
footer a { color:#0ff; text-decoration:none; }
footer a:hover { text-shadow:0 0 10px #0ff; }
</style>
</head>
<body>

<header>
<h1>Aura RP</h1>
<nav>
  <a href="index.html">Ana Sayfa</a>
  <a href="forum.html">Forum</a>
  <a href="market.html">Market</a>
  <a href="sepet.html">🛒 Sepet</a>
</nav>
</header>

<div class="user-bar" id="userStatus"></div>

<div class="market-container" id="marketContainer">
  <!-- Ürünler buraya JS ile eklenecek -->
</div>

<div id="cart">
<h3>Sepet</h3>
<ul id="cartList"></ul>
<button onclick="clearCart()">Sepeti Temizle</button>
</div>

<footer>
<p>© 2025 Aura Roleplay | <a href="https://discord.gg/quWAxqxK4T">Discord'a Katıl</a></p>
</footer>

<script>
// Kullanıcı durumu
const userStatus = document.getElementById('userStatus');
const user = localStorage.getItem('auraRP_user');
const loggedIn = localStorage.getItem('auraRP_loggedIn');
if(loggedIn && user){
  userStatus.innerHTML = `Hoşgeldin, <span>${user}</span>`;
}else{
  userStatus.innerHTML = `Zaten üye misin? <a href="kayit.html" style="color:#0ff">Giriş Yap</a> / <a href="kayit.html" style="color:#0ff">Kayıt Ol</a>`;
}

// Ürünler
const products = [
  { name:"Bronz VIP", desc:"Temel avantajlar ve özel tag.", price:"50₺", img:"img/product1.jpg" },
  { name:"Altın VIP", desc:"Ev, araç, özel tag ve skin hakları.", price:"100₺", img:"img/product2.jpg" },
  { name:"Elmas VIP", desc:"Tüm avantajlar + özel villa.", price:"200₺", img:"img/product3.jpg" }
];

// Ürünleri oluştur
const marketContainer = document.getElementById('marketContainer');
products.forEach(p=>{
  const div = document.createElement('div');
  div.className='product';
  div.innerHTML = `<img src="${p.img}" alt="${p.name}"><h4>${p.name}</h4><p>${p.desc}</p><div class="price">${p.price}</div><button onclick="addToCart('${p.name}')">Sepete Ekle</button>`;
  marketContainer.appendChild(div);
});

// Sepet işlevi
let cart = [];
function addToCart(item){
  cart.push(item);
  renderCart();
}
function renderCart(){
  const cartList = document.getElementById('cartList');
  cartList.innerHTML = '';
  cart.forEach((item,i)=>{
    const li = document.createElement('li');
    li.textContent = item;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '❌';
    removeBtn.style.border='none';
    removeBtn.style.background='transparent';
    removeBtn.style.color='#0ff';
    removeBtn.style.cursor='pointer';
    removeBtn.onclick = ()=>{ cart.splice(i,1); renderCart(); }
    li.appendChild(removeBtn);
    cartList.appendChild(li);
  });
}
function clearCart(){ cart=[]; renderCart(); }
</script>

</body>
</html>
