<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura RP Market</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{background:#0d0d0d;color:#fff;font-family:'Poppins',sans-serif;margin:0;padding:0;}
header{background:rgba(0,0,0,0.8);padding:20px;text-align:center;}
header h1{color:#0ff;font-family:'Orbitron',sans-serif;}
.market-items{display:flex;flex-wrap:wrap;justify-content:center;gap:30px;padding:50px;}
.item-card{background:rgba(0,0,0,0.4);border:2px solid #0ff;border-radius:15px;padding:20px;width:250px;transition:.3s;}
.item-card:hover{box-shadow:0 0 25px #0ff;transform:scale(1.05);}
.item-card h3{color:#0ff;margin-bottom:10px;}
.item-card p{color:#ccc;}
a.back-btn{padding:15px 50px;border:2px solid #0ff;color:#0ff;border-radius:50px;text-decoration:none;display:inline-block;margin-top:20px;transition:.3s;text-shadow:0 0 5px #0ff;}
a.back-btn:hover{background:#0ff;color:#0d0d0d;box-shadow:0 0 25px #0ff;transform:scale(1.05);}
</style>
</head>
<body>

<header>
<h1>Aura RP Market</h1>
</header>

<div class="market-items">
<div class="item-card"><h3>Premium Araç Paketi</h3><p>Özel araçlarla şehri keşfedin.</p></div>
<div class="item-card"><h3>VIP Kıyafet Seti</h3><p>Karakterinize stil katın.</p></div>
<div class="item-card"><h3>Silah Paketi</h3><p>Özel silahlar ve ekipmanlar.</p></div>
</div>

<a href="index.html" class="back-btn">Ana Sayfaya Dön</a>

</body>
</html>
