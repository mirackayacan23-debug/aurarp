<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aura RP Market</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --neon:#00f0ff;
    --neon-weak:#00f0ff55;
    --bg:#0d0d0d;
    --card:#0b0b0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',sans-serif;background:radial-gradient(circle at top,#000010,#020202);color:#fff}
  header{
    display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
    background:rgba(0,0,0,0.8);border-bottom:2px solid var(--neon-weak);backdrop-filter:blur(4px)
  }
  header .brand{display:flex;align-items:center;gap:14px}
  .logo{font-family:'Orbitron',sans-serif;color:var(--neon);font-size:20px;text-shadow:0 0 12px var(--neon)}
  nav a{color:#fff;text-decoration:none;margin:0 10px;transition:.2s}
  nav a:hover{color:var(--neon);text-shadow:0 0 8px var(--neon)}
  .user-cart{display:flex;align-items:center;gap:12px}
  .user{color:var(--neon)}
  .cart-btn{background:transparent;border:2px solid var(--neon);color:var(--neon);padding:6px 12px;border-radius:28px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .cart-count{background:var(--neon);color:#000;padding:2px 8px;border-radius:12px;font-weight:700}
  .container{max-width:1200px;margin:28px auto;padding:0 18px}
  h2{font-family:'Orbitron',sans-serif;color:var(--neon);text-shadow:0 0 12px var(--neon);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .card{background:rgba(0,0,0,0.45);border:2px solid var(--neon-weak);padding:14px;border-radius:12px;transition:all .25s;overflow:hidden}
  .card:hover{transform:translateY(-6px);box-shadow:0 0 20px var(--neon-weak);border-color:var(--neon)}
  .thumb{width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:12px;background:#111}
  .title{color:var(--neon);font-weight:700;margin-bottom:6px}
  .desc{color:#cfcfcf;font-size:14px;min-height:38px;margin-bottom:10px}
  .price{color:#9fffa7;font-weight:700;margin-bottom:10px}
  .card-controls{display:flex;gap:10px;justify-content:center}
  .btn{border:2px solid var(--neon);background:transparent;color:var(--neon);padding:8px 14px;border-radius:999px;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--neon);color:#000;box-shadow:0 0 12px var(--neon)}
  footer{margin-top:40px;padding:18px;text-align:center;background:rgba(0,0,0,0.75);border-top:1px solid var(--neon-weak);color:#bbb}
  @media(max-width:600px){header{flex-direction:column;gap:8px} .thumb{height:120px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">AURA RP MARKET</div>
    <nav>
      <a href="index.html">AnaSayfa</a>
      <a href="forum.html">Forum</a>
      <a href="market.html">Market</a>
    </nav>
  </div>

  <div class="user-cart">
    <div id="userStatus" class="user">...</div>
    <button id="viewCart" class="cart-btn">🛒 Sepet <span id="cartCount" class="cart-count">0</span></button>
  </div>
</header>

<main class="container">
  <section class="market-section">
    <h2>VIP Paketler</h2>
    <div class="grid" id="productGrid"></div>
  </section>

  <section class="market-section">
    <h2>Özel Araçlar</h2>
    <div class="grid" id="vehicleGrid"></div>
  </section>

  <section class="market-section">
    <h2>Evler & Ekstralar</h2>
    <div class="grid" id="extrasGrid"></div>
  </section>
</main>

<footer>
  © 2025 Aura Roleplay — <a href="https://discord.gg/quWAxqxK4T" target="_blank" style="color:var(--neon)">Discord'a Katıl</a>
</footer>

<script src="script.js"></script>
<script>
/* Ürün verisi (isteğe göre genişlet) */
const products = [
  { id:'vip-bronze', cat:'vip', title:'Bronz VIP', desc:'Özel araç, skin ve /vip tagı içerir.', price:50, img:'https://i.imgur.com/fXb2HqX.png' },
  { id:'vip-gold', cat:'vip', title:'Altın VIP', desc:'Bronz avantajlarına ek özel ev hakkı.', price:100, img:'https://i.imgur.com/kRz0epT.png' },
  { id:'vip-diamond', cat:'vip', title:'Elmas VIP', desc:'Tüm ayrıcalıklar + özel araç.', price:150, img:'https://i.imgur.com/0CwHwTg.png' },

  { id:'car-sport', cat:'vehicle', title:'Spor Araç', desc:'Özel hız ve tasarım paketli.', price:120, img:'https://i.imgur.com/XqPrRn8.png' },
  { id:'car-offroad', cat:'vehicle', title:'Off-Road Araç', desc:'Arazide üstün performans sağlar.', price:90, img:'https://i.imgur.com/MXhUhWu.png' },

  { id:'house-villa', cat:'extras', title:'Los Santos Villa', desc:'3 araçlık garaj + özel iç dizayn.', price:250, img:'https://i.imgur.com/wqvE8wU.png' },
  { id:'name-change', cat:'extras', title:'İsim Değişikliği', desc:'Karakter adını değiştirmeni sağlar.', price:15, img:'https://i.imgur.com/qXjBDE2.png' },
  { id:'skin-change', cat:'extras', title:'Skin Değişikliği', desc:'Yeni skin seçme hakkı.', price:20, img:'https://i.imgur.com/nK2AyzC.png' }
];

/* Render ürünler */
function renderProducts(){
  const productGrid = document.getElementById('productGrid');
  const vehicleGrid = document.getElementById('vehicleGrid');
  const extrasGrid = document.getElementById('extrasGrid');
  productGrid.innerHTML = vehicleGrid.innerHTML = extrasGrid.innerHTML = '';

  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img class="thumb" src="${p.img}" alt="${p.title}">
      <div class="title">${p.title}</div>
      <div class="desc">${p.desc}</div>
      <div class="price">₺${p.price}</div>
      <div class="card-controls">
        <button class="btn add-btn" data-id="${p.id}">Sepete Ekle</button>
        <a class="btn" href="https://discord.gg/quWAxqxK4T" target="_blank">Detay</a>
      </div>
    `;
    if(p.cat==='vip') productGrid.appendChild(card);
    if(p.cat==='vehicle') vehicleGrid.appendChild(card);
    if(p.cat==='extras') extrasGrid.appendChild(card);
  });

  // add-btn event
  document.querySelectorAll('.add-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-id');
      addToCartById(id);
    });
  });
}

/* Başlat */
renderProducts();
updateUserStatus();
updateCartBadge();

/* Header butonları */
document.getElementById('viewCart').addEventListener('click', ()=> location.href='sepet.html');
</script>
</body>
</html>
