<div class="market-grid" id="vipProducts"></div>

<script>
// Ürünler
const products = [
  {name:"Bronz VIP", price:50, img:"vip1.jpg", desc:"Temel avantajlar ve özel tag."},
  {name:"Altın VIP", price:100, img:"vip2.jpg", desc:"Ev, araç, özel tag ve skin hakları."},
  {name:"Elmas VIP", price:150, img:"vip3.jpg", desc:"Tüm avantajlar + özel villa."}
];

// Market render
const vipContainer = document.getElementById("vipProducts");

products.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${p.img}" alt="${p.name}">
    <h3>${p.name}</h3>
    <p>${p.desc}</p>
    <p class="price">₺${p.price}</p>
    <div class="buttons">
      <button id="addCart${i}">Sepete Ekle</button>
      <a href="https://discord.gg/quWAxqxK4T">Satın Al</a>
    </div>
  `;
  vipContainer.appendChild(card);

  // Sepete ekle tıklama
  document.getElementById(`addCart${i}`).addEventListener("click", () => {
    let cart = JSON.parse(localStorage.getItem("aura_cart")) || [];
    cart.push(p);
    localStorage.setItem("aura_cart", JSON.stringify(cart));
    alert(`${p.name} sepete eklendi!`);
  });
});
</script>
